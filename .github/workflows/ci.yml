# One job per check so `gh pr checks` shows exactly what failed. Job names are the
# check names – keep them stable.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share a group per branch so superseded runs are cancelled. Each commit on main gets
  # its own group (by SHA), so no main run is ever cancelled or dropped while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Format check
        run: npm run format:check
      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Generated API files must be exactly what the pinned openapi.json generates (GZW-003).
      - name: Contract files unchanged
        run: npm run contract:check
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          # This build is only used by the E2E job, which checks the dev-only /dev/components page.
          # Deploy builds (GZW-006) never set it, so that page is a 404 there.
          GIZE_DEV_PAGES: "1"
          # Public values are baked into the build and validated (src/lib/public-env.ts). They point
          # at the e2e stand-ins (e2e/support/fake-services.mjs, ports in test-users.mjs); keep in
          # step with playwright.config.ts.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8199
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54399
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
          NEXT_PUBLIC_SENTRY_DSN: ""
      - name: Upload build for e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (Playwright + axe)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: .next/

      - name: Read Playwright version
        id: playwright
        # Assigning first makes the step fail if node fails, so the cache key can't go blank.
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      # Tests run headless, so only the headless shell is needed.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium-headless-shell

      - name: E2E tests and screenshots (1440 px and 375 px)
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads package-lock.json only; no install needed. Fails on any high or critical advisory,
      # except one in audit-exceptions.json until its date (an owner decision each time).
      - run: npm run audit:check

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          bin="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"

      - name: Scan full git history
        run: gitleaks git --redact --no-banner --verbose .

  # GZW-006: after every other check passes, main goes live at admin.gizetransport.com, and each
  # PR uploads a version (not live) with its own preview address, checked and posted on the PR.
  # Anyone who can push a branch here can reach the Cloudflare token (a PR's code builds and
  # uploads with it): only give write access to people trusted with production.
  deploy:
    name: Deploy (Cloudflare)
    needs: [lint, typecheck, unit, build, e2e, audit, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the preview address comment
    concurrency:
      # One production deploy at a time (each also checks it is still main's newest commit);
      # previews per PR, the newest wins.
      group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Dependabot runs get no secrets: the check passes with nothing to deploy (a skipped check
      # would block merging).
      DEPLOYS: ${{ github.actor != 'dependabot[bot]' }}
      # Public values, baked into the build (repository variables, not secrets).
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - name: Nothing to deploy for Dependabot
        if: env.DEPLOYS != 'true'
        run: echo "::notice::Dependabot run, nothing deployed."

      # A slower run of an older commit must not replace a newer one already live.
      - name: Still main's newest commit?
        id: newest
        if: env.DEPLOYS == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to ${tip:0:7}: its own run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DEPLOYS == 'true' && steps.newest.outputs.deploy != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: env.DEPLOYS == 'true' && steps.newest.outputs.deploy != 'false'

      # A deploy build never sets GIZE_DEV_PAGES: the dev-only pages are a 404 there.
      - name: Build the Worker
        if: env.DEPLOYS == 'true' && steps.newest.outputs.deploy != 'false'
        run: npm run cf:build

      # The Cloudflare token is only given to the steps that upload.
      - name: Deploy to admin.gizetransport.com
        if: env.DEPLOYS == 'true' && github.event_name == 'push' && steps.newest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      # A version is added to the existing Worker, so previews start after main's first deploy;
      # until then (and until that deploy has turned preview addresses on) this says so and passes.
      - name: Upload the PR preview
        if: env.DEPLOYS == 'true' && github.event_name == 'pull_request'
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          if ! npx wrangler deployments list --name gize-admin > /dev/null 2>&1; then
            echo "::notice::No production deploy yet: previews start after the first merge to main."
            exit 0
          fi
          npx opennextjs-cloudflare upload --preview-alias "$ALIAS"
          url=$(node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
            const upload = lines.filter(Boolean).map(JSON.parse)
              .find((entry) => entry.type === "version-upload");
            process.stdout.write(upload?.preview_alias_url ?? "");
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::notice::Uploaded, but preview addresses aren't on yet (main's next deploy turns them on)."
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The preview really runs on Workers with the policy: the header has a nonce, and the
      # page's scripts carry the same one.
      - name: Check the preview
        if: steps.preview.outputs.url != ''
        shell: bash
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          headers=$(curl -sS -D - -o page.html --retry 5 --retry-all-errors "$URL/sign-in")
          nonce=$(printf '%s' "$headers" | grep -i '^content-security-policy:' | grep -oE "'nonce-[^']+'" | head -1 | sed -E "s/'nonce-(.*)'/\1/")
          test -n "$nonce"
          grep -q "nonce=\"$nonce\"" page.html
          printf '%s' "$headers" | grep -qi '^x-content-type-options: nosniff'

      - name: Post the preview address on the PR
        if: steps.preview.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- gize-preview -->"
          body="$marker"$'\n'"Preview of ${SHA:0:7}: $URL"$'\n\n'"Not live: admin.gizetransport.com changes only when this is merged. Data loads only if the API allows preview addresses."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
