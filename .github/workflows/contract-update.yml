# Daily check against the backend contract (GZW-003, docs/api-contract.md step 3):
# - when gize-admin-api has an api-v* tag newer than src/lib/api/CONTRACT_VERSION, opens an
#   issue "Contract update available: api-vX.Y.Z" with oasdiff's summary and changelog;
# - fails if the pinned openapi.json or api-contract.md differ from the backend's files at the
#   pinned tag (CI's offline check only catches edits that didn't update contract.sha256).
# The backend repo is private, so reading it needs the BACKEND_CONTRACT_TOKEN secret: a
# fine-grained token with read-only Contents on gize-admin-api only. Without it the job skips
# with a warning. The token is only given to the steps that read the backend.
name: Contract update

on:
  schedule:
    - cron: "17 5 * * *" # daily, 08:17 in Addis Ababa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-update
  cancel-in-progress: false

env:
  CONTRACT_REPO: gize-transport/gize-admin-api
  OASDIFF_VERSION: "1.33.0"
  # sha256 of oasdiff_1.33.0_linux_amd64.tar.gz from the release's checksums.txt (same as the backend)
  OASDIFF_SHA256: "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check for a newer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Find the newest backend tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.BACKEND_CONTRACT_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::BACKEND_CONTRACT_TOKEN is not set, so the contract update check is skipped (see this workflow's header)."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only reads tags with gh: npm ci isn't needed.
          latest=$(node scripts/contract-sync.mjs --latest)
          pinned=$(tr -d '[:space:]' < src/lib/api/CONTRACT_VERSION)
          echo "Pinned ${pinned}, latest ${latest}."
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          # Only a newer tag is an update (a deleted or re-cut tag can make the latest older).
          newest=$(printf '%s\n%s\n' "${pinned}" "${latest}" | sort --version-sort | tail -n 1)
          if [ "${latest}" != "${pinned}" ] && [ "${newest}" = "${latest}" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for an issue about this tag
        id: issue
        if: steps.tag.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          title="Contract update available: ${LATEST}"
          # Closed issues count too: closing one ("not now") must not reopen it every day.
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --limit 100 \
            --search "\"${title}\" in:title" \
            --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "${existing}" ]; then
            echo "Issue #${existing} already covers ${LATEST}."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Download the newer openapi.json
        if: steps.issue.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKEND_CONTRACT_TOKEN }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${CONTRACT_REPO}/contents/openapi.json?ref=${LATEST}" > "${RUNNER_TEMP}/latest.json"

      - name: Install oasdiff (pinned release, SHA-256 verified)
        if: steps.issue.outputs.create == 'true'
        run: |
          tarball="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${tarball}"
          echo "${OASDIFF_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${tarball}" --directory "${RUNNER_TEMP}" oasdiff

      - name: Write the changelog
        if: steps.issue.outputs.create == 'true'
        env:
          LATEST: ${{ steps.tag.outputs.latest }}
          PINNED: ${{ steps.tag.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p contract-update
          "${RUNNER_TEMP}/oasdiff" summary src/lib/api/openapi.json "${RUNNER_TEMP}/latest.json" > contract-update/summary.yaml
          "${RUNNER_TEMP}/oasdiff" changelog src/lib/api/openapi.json "${RUNNER_TEMP}/latest.json" -f markdown > contract-update/changelog.md
          {
            echo "The backend tagged **${LATEST}**; this repo is pinned to **${PINNED}**."
            echo
            echo "- Release: https://github.com/${CONTRACT_REPO}/releases/tag/${LATEST}"
            echo "- To update, on a ticket branch: \`npm run contract:sync -- --tag ${LATEST}\`, then \`npm run typecheck\`."
            echo
            echo "## Summary"
            echo
            echo '```yaml'
            cat contract-update/summary.yaml
            echo '```'
            echo
            echo "## Changelog"
            echo
            # An issue body holds at most 65,536 characters; the full changelog is in the run's artifact.
            # Cut at a line break, so no line (or character) is split.
            if [ "$(wc -c < contract-update/changelog.md)" -gt 50000 ]; then
              head -c 50000 contract-update/changelog.md | sed '$d'
              echo
              echo
              echo "_Cut short. The full changelog is the \`contract-changelog\` artifact of ${RUN_URL}._"
            else
              cat contract-update/changelog.md
            fi
          } > contract-update/issue.md

      - name: Upload the full changelog
        if: steps.issue.outputs.create == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-changelog
          path: contract-update/
          retention-days: 30

      - name: Open the issue
        if: steps.issue.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.issue.outputs.title }}
        run: gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body-file contract-update/issue.md

      # Last, so a mismatch doesn't stop the update issue above. It fails the run (GitHub emails
      # the workflow's owner) rather than opening an issue.
      - name: Pinned files match their tag
        if: ${{ !cancelled() && steps.tag.outputs.pinned != '' }}
        env:
          GH_TOKEN: ${{ secrets.BACKEND_CONTRACT_TOKEN }}
          PINNED: ${{ steps.tag.outputs.pinned }}
        run: |
          status=0
          for pair in "openapi.json:src/lib/api/openapi.json" "docs/api-contract.md:docs/api-contract.md"; do
            remote="${pair%%:*}"
            local_file="${pair#*:}"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${CONTRACT_REPO}/contents/${remote}?ref=${PINNED}" > "${RUNNER_TEMP}/pinned-file"
            if ! cmp --silent "${RUNNER_TEMP}/pinned-file" "${local_file}"; then
              echo "::error::${local_file} differs from ${remote} at ${PINNED}. Run npm run contract:sync -- --tag ${PINNED}; never edit it by hand."
              status=1
            fi
          done
          exit "${status}"
