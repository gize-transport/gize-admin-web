name: Set up Node and dependencies
description: Installs the Node version from .nvmrc and runs npm ci with the npm cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci
      shell: bash
